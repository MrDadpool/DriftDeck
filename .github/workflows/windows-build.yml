name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\DriftDeck.slnx

      - name: Build
        run: dotnet build .\DriftDeck.slnx --configuration Release --no-restore

      - name: Create portable Windows build
        shell: pwsh
        run: |
          # Tag builds stamp their version into the executable, so a released build can tell
          # whether a newer release exists. Untagged builds keep the csproj version.
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            .\scripts\Build-Portable.ps1 -Version "${{ github.ref_name }}"
          } else {
            .\scripts\Build-Portable.ps1
          }

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: DriftDeck-win-x64
          path: artifacts/DriftDeck-win-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download portable build
        uses: actions/download-artifact@v8
        with:
          name: DriftDeck-win-x64
          path: artifacts

      - name: Publish GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes --title "DriftDeck ${{ github.ref_name }}"
          }
          gh release upload "${{ github.ref_name }}" ".\artifacts\DriftDeck-win-x64.zip" --repo "${{ github.repository }}" --clobber

